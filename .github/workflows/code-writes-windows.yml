name: code-writes-windows

on:
  push:
    paths: ['stands/code-writes/**', '.github/workflows/code-writes-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-writes-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the code-write probe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'code-writes'
          & "$PWD\stands\code-writes\run-windows.ps1" -OutputDirectory $out
      - name: Record the processor
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'code-writes'
          if (Test-Path $out) {
            Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfLogicalProcessors |
              ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'processor.json')
          }
      - name: Keep outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-writes-${{ matrix.os }}
          path: ${{ runner.temp }}/code-writes/
          if-no-files-found: warn
