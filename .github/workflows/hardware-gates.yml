name: hardware-gates

on:
  push:
    paths: ['fex/**', 'stands/hardware/**', 'stands/synthetic/**', 'stands/instruction-cost/**', '.github/workflows/hardware-gates.yml', '.github/workflows/hardware-native-build.yml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Reviewed source candidate directory'
        required: true
        default: 'stands/hardware/candidates/release-1.0.8'
      mode:
        description: 'Full includes quick plus the complete hardware tables'
        type: choice
        options: [full, quick]
        default: full
      reuse_run:
        description: 'Optional completed run ID: re-reduce its hardware-cell artifacts without builds or native sweeps'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: hardware-gates-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE: ${{ inputs.candidate || 'stands/hardware/candidates/published-ci' }}
  MODE: ${{ github.event_name == 'push' && 'quick' || inputs.mode || 'full' }}
  LC_ALL: C
  TZ: UTC
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check portable repository names before native builds
        run: python3 stands/check_portable_paths.py
      - id: plan
        run: python3 stands/hardware/plan.py --candidate "$CANDIDATE" --mode "$MODE"
  build-accepted:
    if: ${{ !inputs.reuse_run }}
    needs: plan
    uses: ./.github/workflows/hardware-native-build.yml
    with:
      candidate: ${{ inputs.candidate || 'stands/hardware/candidates/published-ci' }}
      flavor: accepted

  build-negative:
    if: ${{ !inputs.reuse_run }}
    needs: plan
    uses: ./.github/workflows/hardware-native-build.yml
    with:
      candidate: ${{ inputs.candidate || 'stands/hardware/candidates/published-ci' }}
      flavor: negative

  hardware:
    if: ${{ !inputs.reuse_run }}
    needs: [plan, build-accepted]
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardware-runner-accepted
          path: build/hardware
      - name: Restore executable permissions and native library
        run: |
          test "$(uname -m)" = arm64
          mkdir -p build/hardware/bundle
          tar -xzf build/hardware/runner.tar.gz -C build/hardware/bundle
      - name: Hardware shard
        env:
          COMPONENT: ${{ matrix.component }}
          ARM: ${{ matrix.arm }}
          MODE: ${{ matrix.mode }}
          INDEX: ${{ matrix.index }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python3 stands/hardware/plan.py --candidate "$CANDIDATE" --prepare-only
          python3 stands/hardware/run.py --candidate "$CANDIDATE" --bundle build/hardware/bundle \
            "--$COMPONENT" "--$MODE" --arm "$ARM" --shards "$SHARDS" --index "$INDEX" --out build/hardware/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-cell-${{ matrix.component }}-${{ matrix.arm }}-${{ matrix.mode }}-${{ matrix.index }}
          path: build/hardware/report/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  instruction-cost:
    if: ${{ !inputs.reuse_run }}
    needs: build-accepted
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardware-runner-accepted
          path: build/hardware
      - name: Restore native emission frontend
        run: |
          test "$(uname -m)" = arm64
          mkdir -p build/hardware/bundle
          tar -xzf build/hardware/runner.tar.gz -C build/hardware/bundle
          python3 -m venv build/cost-venv
          build/cost-venv/bin/pip install capstone==5.0.7
      - name: Validate counting and authored generators
        run: build/cost-venv/bin/python -m unittest discover -s stands/instruction-cost -p 'test_*.py'
      - name: Read last measured successful main baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 stands/instruction-cost/baseline.py --repository "$REPOSITORY" \
            --current-run "$CURRENT_RUN" --out build/instruction-baseline
      - name: Count static ARM instructions and compare both repeated arms
        run: |
          python3 stands/hardware/plan.py --candidate "$CANDIDATE" --prepare-only
          baseline=()
          if test -f build/instruction-baseline/RESULT.json; then
            baseline=(--baseline build/instruction-baseline/RESULT.json)
          fi
          build/cost-venv/bin/python stands/instruction-cost/measure.py --candidate "$CANDIDATE" \
            --bundle build/hardware/bundle --out build/instruction-cost "${baseline[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instruction-cost-RESULT
          path: build/instruction-cost/
          if-no-files-found: error
          retention-days: 30

  negative:
    if: ${{ !inputs.reuse_run }}
    needs: build-negative
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hardware-runner-negative
          path: build/hardware
      - name: Restore deliberately broken translator
        run: |
          test "$(uname -m)" = arm64
          mkdir -p build/hardware/bundle
          tar -xzf build/hardware/runner.tar.gz -C build/hardware/bundle
      - name: Require measured FAIL from the broken translator
        run: |
          python3 stands/hardware/plan.py --candidate "$CANDIDATE" --prepare-only
          set +e
          python3 stands/hardware/run.py --candidate "$CANDIDATE" --bundle build/hardware/bundle \
            --hwflags --quick --arm on --flavor negative --out build/hardware/report
          result=$?
          set -e
          test "$result" = 1
          python3 -c 'import json,sys; sys.path.insert(0,"stands/hardware"); from merge import negative_check; assert negative_check(json.load(open("build/hardware/report/RESULT.json")))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-cell-negative
          path: build/hardware/report/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  verdict:
    if: always()
    needs: [plan, hardware, negative]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_run }}
        with:
          pattern: hardware-cell-*
          path: build/hardware/cells
      - name: Reuse original hardware evidence
        if: ${{ inputs.reuse_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: hardware-cell-*
          path: build/hardware/cells
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Reconstruct serial canonical fingerprints
        run: |
          python3 stands/hardware/plan.py --candidate "$CANDIDATE" --prepare-only
          python3 stands/hardware/merge.py --candidate "$CANDIDATE" --mode "$MODE" --input build/hardware/cells --out build/hardware/final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-gates-RESULT
          path: build/hardware/final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
