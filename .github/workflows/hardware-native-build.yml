name: hardware-native-build

on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      flavor:
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE: ${{ inputs.candidate }}
  LC_ALL: C
  TZ: UTC
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CCACHE_DIR: ${{ github.workspace }}/build/hardware-ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/hardware-ccache
          key: hardware-fexcore-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/**') }}-${{ inputs.flavor }}-${{ hashFiles('stands/synthetic/**', 'stands/hardware/*.cpp', 'stands/hardware/*.h', 'stands/hardware/candidates/**', 'stands/hardware/controls/**') }}
          restore-keys: |
            hardware-fexcore-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fex/patches/**') }}-${{ inputs.flavor }}-
      - name: Dependencies and protocol tests
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja ccache
          python3 -m venv build/hardware-venv
          build/hardware-venv/bin/python -m pip install capstone==5.0.7
          python3 -m unittest discover -s stands/hardware/tests -v
      - name: Build native runner from reviewed candidate
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          python3 stands/hardware/plan.py --candidate "$CANDIDATE" --prepare-only
          build/hardware-venv/bin/python stands/hardware/build.py --candidate "$CANDIDATE" --flavor "$FLAVOR" > build/hardware-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-build-evidence-${{ inputs.flavor }}
          path: |
            build/hardware-build.log
            build/hardware/negative-apply-check.json
            build/hardware/bundle/BUILD.json
            build/hardware/cache/simd-assembler.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-runner-${{ inputs.flavor }}
          path: build/hardware/runner.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
