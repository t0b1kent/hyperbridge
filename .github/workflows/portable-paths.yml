# SPDX-License-Identifier: MIT
name: portable-paths
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows checkout names and the complete device family
        run: |
          python3 -m unittest discover -s stands/hardware/tests -p test_portable_paths.py -v
          python3 stands/check_portable_paths.py
