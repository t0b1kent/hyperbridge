name: REPRO109 independent FEX source architectures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro109-fex-c9-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  architecture:
    name: Source ${{ matrix.architecture }}
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: [fex64, fex32]
    env:
      REPRO109_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Initialize slot evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repro109-fex-slot"
          printf '%s\n' "$REPRO109_ARCHITECTURE" > "$RUNNER_TEMP/repro109-fex-slot/selected.txt"
          printf 'NOT_REACHED\n' > "$RUNNER_TEMP/repro109-fex-slot/state.txt"
          printf 'NOT_ENABLED\n' > "$RUNNER_TEMP/repro109-fex-slot/rc.txt"
      - name: Checkout dispatched recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select pinned driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Select pinned Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for xcode_app in /Applications/Xcode*.app; do
            [ -d "$xcode_app/Contents/Developer" ] || continue
            actual=$(DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version)
            if [ "$actual" = $'Xcode 16.4\nBuild version 16F6' ]; then
              printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
              selected=1
              break
            fi
          done
          [ "$selected" = 1 ] || { printf 'Pinned Xcode 16.4/16F6 missing\n'; exit 1; }
      - name: Build selected architecture with existing source driver
        shell: bash
        run: |
          set -uo pipefail
          slot="$RUNNER_TEMP/repro109-fex-slot"
          case "$REPRO109_ARCHITECTURE" in
            fex64|fex32) ;;
            *) printf 'Invalid architecture selector\n'; exit 2 ;;
          esac
          python3 -I -B build/repro109fex/build.py --out "$slot/build" --only "$REPRO109_ARCHITECTURE" \
            > "$slot/driver.log" 2>&1
          build_rc=$?
          printf '%s\n' "$build_rc" > "$slot/rc.txt"
          printf 'EXECUTED\n' > "$slot/state.txt"
          printf 'FEX %s rc=%s; install skipped; full logs in artifact\n' "$REPRO109_ARCHITECTURE" "$build_rc"
          exit "$build_rc"
      - name: Preserve complete bounded reports and unsigned outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro109-fex-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/repro109-fex-slot/
          if-no-files-found: error
          retention-days: 7
