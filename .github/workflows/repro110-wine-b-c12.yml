name: repro110-wine-b-c12
on:
  workflow_dispatch:
    inputs:
      q_restores:
        description: 'Compile ARM64EC PE modules with the split Q-restore option (default off)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: repro110-wine-b-c12-${{ inputs.q_restores }}
  cancel-in-progress: false
jobs:
  inputs:
    if: github.repository == 't0b1kent/hyperbridge'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Check exact recipe files without source downloads or compilation
        run: python -I -B build/repro110wine/build_full.py --check-inputs
      # The 47 library sources are fetched here, in minutes, and not inside the three-hour build: a mirror that is down
      # (38518009827 and 38518013267 each lost about 80 minutes to one) now costs this job and nothing else.
      - name: Acquire and verify all 47 source components without building
        shell: bash
        run: |
          set -euo pipefail
          python -I -B build/repro110wine/prepare_sources.py --profile github-macos26-arm64 \
            --work "$RUNNER_TEMP/repro110-wine-b-c12-inputs" --workers 8 --minutes 10 \
            > "$RUNNER_TEMP/repro110-wine-b-c12-inputs.log" 2>&1
          tar -czf "$RUNNER_TEMP/repro110-wine-b-c12-inputs.tar.gz" \
            -C "$RUNNER_TEMP/repro110-wine-b-c12-inputs" .
      - name: Preserve every input status and verified source set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro110-wine-b-c12-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro110-wine-b-c12-inputs/reports/
            ${{ runner.temp }}/repro110-wine-b-c12-inputs.tar.gz
            ${{ runner.temp }}/repro110-wine-b-c12-inputs.log
          if-no-files-found: error
          retention-days: 30
  wine:
    needs: inputs
    if: github.repository == 't0b1kent/hyperbridge'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Receive the verified source set from the first job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repro110-wine-b-c12-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/repro110-wine-b-c12-prepared
      - name: Unpack the source set and rehash every archive before any compiler
        run: >-
          python -I -B build/repro110wine/prepare_sources.py --profile github-macos26-arm64
          --extract "${{ runner.temp }}/repro110-wine-b-c12-prepared/repro110-wine-b-c12-inputs.tar.gz"
          --work "${{ runner.temp }}/repro110-wine-b-c12-prepared-inputs"
      - name: Retrieve the existing compiler artifact from this repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repro109-llvm22-macos-full-f2c751ac5e2c744aa66486b1a75f46b204f83017
          run-id: 37782806683
          repository: t0b1kent/hyperbridge
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/compiler-input
      - name: Run pinned source recipe with archive guards before compiler execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPRO110_Q_RESTORES: ${{ inputs.q_restores && '1' || '' }}
        run: |
          bash jobs/repro110-wine-b-c12.sh \
            "$RUNNER_TEMP/sourcebuilt26-results" \
            "$RUNNER_TEMP/compiler-input/llvm22-macos-results.tar.gz" \
            "$RUNNER_TEMP/repro110-wine-b-c12-prepared-inputs"
      - name: Preserve complete bounded results even on build or publisher failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro110-wine-b-c12-q${{ inputs.q_restores }}-${{ github.sha }}
          path: ${{ runner.temp }}/sourcebuilt26-results
          if-no-files-found: warn
          retention-days: 30
