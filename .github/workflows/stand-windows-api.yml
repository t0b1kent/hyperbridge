name: Windows API stand (real Windows x86-64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }} attempt ${{ matrix.attempt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run in the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the x64 C++ tools was not found' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $out = Join-Path $PWD 'results'
          $code = 'not-run'
          try {
            & (Join-Path $PWD 'stands\windows-api\run-windows.ps1') -OutputDirectory $out
            $code = $LASTEXITCODE
          } catch {
            Write-Output "run script stopped: $($_.Exception.Message)"
            $code = 'threw'
          }
          if (-not (Test-Path -LiteralPath $out)) { $null = New-Item -ItemType Directory -Path $out }
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $os = (Get-CimInstance Win32_OperatingSystem).Version
          "$cpu`n$os`nrun script exit: $code" | Out-File -Encoding utf8 (Join-Path $out 'machine.txt')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $out 'build\probe.exe'), (Join-Path $out 'build\probe.obj')
          Get-Content (Join-Path $out 'machine.txt')
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-api-${{ matrix.os }}-${{ matrix.attempt }}
          path: results
          if-no-files-found: warn
